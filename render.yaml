databases:
  - name: studyverse-db
    databaseName: studyverse
    user: studyverse
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: studyverse-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend-2
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py import_syllabus && python manage.py import_calendar
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: studyverse-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false